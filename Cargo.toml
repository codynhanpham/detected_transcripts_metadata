[package]
name = "detected_transcripts_metadata"
authors = ["Cody Nhan Pham"]
organization = "Oviedo Lab"
description = "A command line tool to efficiently extract metadata from the detected_transcripts.csv file generated on the Vizgen MERFISH platform."
license = "MIT"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5.15"
fast-float = "0.2.0"
fxhash = "0.2.1"
indicatif = "0.17.11"
memchr = { version = "2", default-features = false }
once_cell = "1.20.3"
rayon = "1.10.0"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = false
strip = "debuginfo"
opt-level = 3
lto = true