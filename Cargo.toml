[package]
name = "detected_transcripts_metadata"
authors = ["Cody Nhan Pham"]
organization = "Oviedo Lab"
description = "A command line tool to efficiently extract metadata from the detected_transcripts.csv file generated on the Vizgen MERFISH platform."
license = "MIT"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dashmap = { version = "6.0", features = ["serde"] }
memchr = "2.7.4"
memmap = "0.7.0"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
